<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medora — Medical Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
</head>
<body>
    <div class="chat-shell">
        <div class="chat-card">
            <header class="chat-header">
                <div class="header-left">
                    <div class="avatar">
                        <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" alt="Medora">
                        <span class="status-dot"></span>
                    </div>
                    <div class="header-info">
                        <h1>Medora</h1>
                        <p><span class="online-text">●</span> Online · Medical Assistant</p>
                    </div>
                </div>
                <span class="badge">AI Assistant</span>
            </header>

            <div id="messageFormeight" class="messages-area"></div>

            <footer class="chat-footer">
                <form id="messageArea" autocomplete="off">
                    <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" required>
                    <button type="submit" id="send" aria-label="Send message"><i class="fas fa-paper-plane"></i></button>
                </form>
                <p class="disclaimer">Medora provides general health information, not a diagnosis. Always consult a qualified doctor for medical advice.</p>
            </footer>
        </div>
    </div>

    <script>
        function escapeHtml(value) {
            return value.replace(/[&<>'"]/g, function(character) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    "'": "&#39;",
                    '"': "&quot;"
                }[character];
            });
        }

        function formatInlineMarkdown(value) {
            return escapeHtml(value)
                .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                .replace(/__(.+?)__/g, "<strong>$1</strong>")
                .replace(/\*([^*]+)\*/g, "<em>$1</em>");
        }

        function renderAssistantMessage(response) {
            const normalizedResponse = response
                .replace(/\\r\\n/g, "\n")
                .replace(/\\r/g, "\n")
                .replace(/\\n/g, "\n")
                .replace(/\r\n/g, "\n")
                .replace(/\r/g, "\n")
                .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
                .replace(/\s+[-]{3,}\s+/g, "\n\n")
                .replace(/\s+-\s+(?=(?:\*\*|[A-Z]))/g, "\n- ");
            const lines = normalizedResponse.split("\n");
            let html = "";
            let listOpen = false;

            function closeList() {
                if (listOpen) {
                    html += "</ul>";
                    listOpen = false;
                }
            }

            lines.forEach(function(line) {
                const trimmedLine = line.trim();
                const bullet = trimmedLine.match(/^[-*]\s+(.+)/);

                if (!trimmedLine) {
                    closeList();
                    return;
                }

                if (bullet) {
                    if (!listOpen) {
                        html += "<ul>";
                        listOpen = true;
                    }
                    html += "<li>" + formatInlineMarkdown(bullet[1]) + "</li>";
                    return;
                }

                closeList();
                html += "<p>" + formatInlineMarkdown(trimmedLine) + "</p>";
            });

            closeList();
            return html;
        }

        function timeNow() {
            const date = new Date();
            let hours = date.getHours();
            const minutes = date.getMinutes();
            const suffix = hours >= 12 ? "PM" : "AM";
            hours = hours % 12;
            if (hours === 0) hours = 12;
            return hours + ":" + (minutes < 10 ? "0" + minutes : minutes) + " " + suffix;
        }

        function scrollToBottom() {
            const area = $("#messageFormeight");
            area.animate({ scrollTop: area.prop("scrollHeight") }, 250);
        }

        $(document).ready(function() {
            const welcome = renderAssistantMessage(
                "Hello! I'm **Medora**, your medical assistant.\n\nAsk me about symptoms, conditions, or general health concerns and I'll do my best to help you."
            );
            $("#messageFormeight").append(
                '<div class="msg bot-msg"><div class="bubble">' + welcome + '</div><span class="msg-time">' + timeNow() + '</span></div>'
            );

            $("#messageArea").on("submit", function(event) {
                event.preventDefault();

                const rawText = $("#text").val().trim();
                if (!rawText) return;

                const str_time = timeNow();

                $("#messageFormeight").append(
                    '<div class="msg user-msg"><div class="bubble">' + escapeHtml(rawText) + '</div><span class="msg-time">' + str_time + '</span></div>'
                );
                $("#text").val("");
                scrollToBottom();

                $("#messageFormeight").append(
                    '<div class="msg bot-msg typing"><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>'
                );
                scrollToBottom();

                // Replace the typing indicator with a live streaming bubble
                $(".typing").remove();
                const bubble = $('<div class="msg bot-msg"><div class="bubble"></div><span class="msg-time">' + str_time + '</span></div>');
                $("#messageFormeight").append(bubble);
                const bubbleContent = bubble.find(".bubble");
                let streamedText = "";

                // Use fetch + ReadableStream — the reliable way to stream in all browsers
                fetch("/get", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "msg=" + encodeURIComponent(rawText)
                }).then(function(response) {
                    if (!response.ok || !response.body) {
                        throw new Error("Bad response");
                    }
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    return new Promise(function(resolve, reject) {
                        function readChunk() {
                            reader.read().then(function(result) {
                                if (result.done) {
                                    resolve();
                                    return;
                                }
                                // Decode the bytes and append to what we have
                                streamedText += decoder.decode(result.value, { stream: true });
                                bubbleContent.html(renderAssistantMessage(streamedText));
                                scrollToBottom();
                                readChunk();
                            }).catch(reject);
                        }
                        readChunk();
                    });
                }).catch(function() {
                    bubbleContent.html('<span class="error">Sorry, something went wrong. Please try again.</span>');
                    scrollToBottom();
                });
            });
        });
    </script>
</body>
</html>
